<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('tetris-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema">🌙</button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="overlay-records" class="records-panel hidden">
          <p class="records-heading">RÉCORDS</p>
          <table class="records-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Puntos</th>
                <th>Líneas</th>
                <th>Nivel</th>
              </tr>
            </thead>
            <tbody id="overlay-records-body"></tbody>
          </table>
          <div class="records-metrics">
            <span>Mejor combo: <strong id="overlay-best-combo">0</strong></span>
            <span>Líneas máximas: <strong id="overlay-max-lines">0</strong></span>
          </div>
          <div id="name-entry" class="name-entry hidden">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-score-btn" type="button">Guardar</button>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay start-screen hidden">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>

        <div class="records-panel">
          <p class="records-heading">RÉCORDS</p>
          <table class="records-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Puntos</th>
                <th>Líneas</th>
                <th>Nivel</th>
              </tr>
            </thead>
            <tbody id="start-records-body"></tbody>
          </table>
          <div class="records-metrics">
            <span>Mejor combo: <strong id="start-best-combo">0</strong></span>
            <span>Líneas máximas: <strong id="start-max-lines">0</strong></span>
          </div>
        </div>

        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="reset-records-btn" type="button">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
